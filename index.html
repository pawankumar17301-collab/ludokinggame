<title>Ludo King - Pawan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#ff6a00,#ee0979);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;font-family:Arial}
h1{color:#fff;text-shadow:2px 2px 4px #000;margin:10px}
#board{width:96vw;max-width:460px;height:96vw;max-height:460px;background:#fff;border:5px solid #000;border-radius:10px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}

.r1{background:#ff4444}.g1{background:#44ff44}.y1{background:#ffeb3b}.b1{background:#4444ff}
.tok{width:18px;height:18px;border-radius:50%;border:2px solid #000;position:absolute;z-index:9;cursor:pointer}
.rc{background:#c00}.gc{background:#0a0}.yc{background:#db0}.bc{background:#00c}
#ctrl{margin-top:10px;background:#fff;padding:10px;border-radius:10px;width:96vw;max-width:460px;text-align:center}
#dice{width:60px;height:60px;background:#fff;border:3px solid #000;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
</style>
</head>
