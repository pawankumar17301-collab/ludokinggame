<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ludo King</title><style>body{background:#0f172a;color:#fff;font-family:Arial;text-align:center} #board{width:320px;height:320px;margin:10px auto;background:#fff;display:grid;grid-template-columns:repeat(15,1fr);border:3px solid #000}.cell{border:.5px solid #ccc} #dice{font-size:60px} button{padding:12px 25px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:18px}</style></head><body><h2>🎲 LUDO KING 🎲</h2><p id="msg">Red ki baari</p><div id="board"></div><div id="dice" onclick="roll()">🎲</div><button onclick="roll()">ROLL</button><p id="turn">Red</p><script>let c=0,cols=["Red","Green","Yellow","Blue"];let b=document.getElementById("board");for(let i=0;i<225;i++){let d=document.createElement("div");d.className="cell";let r=Math.floor(i/15),cl=i%15;if(r<6&&cl<6)d.style.background="#ffb3b3";if(r<6&&cl>8)d.style.background="#b3ffb3";if(r>8&&cl<6)d.style.background="#ffffb3";if(r>8&&cl>8)d.style.background="#b3d9ff";b.appendChild(d)}function roll(){let v=Math.floor(Math.random()*6)+1;document.getElementById("dice").innerText=v;document.getElementById("msg").innerText=cols[c]+" ne "+v+" nikala";if(v!=6)c=(c+1)%4;document.getElementById("turn").innerText=cols[c] }</script></body></html>
