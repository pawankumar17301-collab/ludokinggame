DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo King Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        #board {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 2px solid #fff;
            position: relative;
        }
        .cell {
            border: 1px solid #444;
        }
        .red { background: red; }
        .green { background: green; }
        .blue { background: blue; }
        .yellow { background: yellow; }
        
        /* Goţiyo (Pieces) ki styling */
        .goti {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            z-index: 10;
        }
        .goti-red { background: darkred; }
        .goti-green { background: darkgreen; }
        .goti-blue { background: darkblue; }
        .goti-yellow { background: goldenrod; }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>LUDO KING</h1>
    <div id="board"></div>
    <br>
    <button onclick="rollDice()">ROLL DICE</button>
    <h2 id="dice">1</h2>

    <script>
        const board = document.getElementById('board');

        // 15x15 Grid (225 cells) bana rahe hain
        for (let i = 0; i < 225; i++) {
            let d = document.createElement('div');
            d.classList.add('cell');
            
            // Basic Color Zones Logic
            let row = Math.floor(i / 15);
            let col = i % 15;

            if (row < 6 && col < 6) d.classList.add('red');
            else if (row < 6 && col > 8) d.classList.add('green');
            else if (row > 8 && col < 6) d.classList.add('blue');
            else if (row > 8 && col > 8) d.classList.add('yellow');

            board.appendChild(d);
        }

        // Dice Roll Function
        function rollDice() {
            let n = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice').innerText = n;
        }

        // Goţiyon (Pieces) ki Initial Positions
        const pieces = [
            { id: 'r1', class: 'goti-red', top: '30px', left: '30px' },
            { id: 'g1', class: 'goti-green', top: '30px', left: '250px' },
            { id: 'b1', class: 'goti-blue', top: '250px', left: '30px' },
            { id: 'y1', class: 'goti-yellow', top: '250px', left: '250px' }
        ];

        // Goţiyon ko board par render karna
        pieces.forEach(p => {
            let goti = document.createElement('div');
            goti.classList.add('goti', p.class);
            goti.id = p.id;
            goti.style.top = p.top;
            goti.style.left = p.left;
            board.appendChild(goti);
        });
